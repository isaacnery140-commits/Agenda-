<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendas de Máquinas</title>
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Metas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: celular primeiro. Abas de período no topo; visão geral = meta do ano + semestres + barras por mês; mês = lista de vendas em cartões; ficha de edição abre de baixo. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5d6b78; --line:#dde3e8;
  --accent:#1f5f8b; --accent-soft:#dde9f3; --amber:#d98b1a; --amber-soft:#fbecd5;
  --good:#2f7d4f; --good-soft:#dcefe3; --warn:#b4541a; --warn-soft:#f8e5d8;
  --on-accent:#ffffff;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f151b; --surface:#17202a; --ink:#e6ecf1; --muted:#93a3b1; --line:#2a3642;
    --accent:#6fb0de; --accent-soft:#1d3447; --amber:#f0a83c; --amber-soft:#3a2a12;
    --good:#6cc391; --good-soft:#1a3326; --warn:#f0965a; --warn-soft:#3a2516;
    --on-accent:#0f151b; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 16px 6px;max-width:1100px;margin:0 auto}
h1{font:800 19px/1.1 var(--display);margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h1 img{width:26px;height:26px;border-radius:7px}
.top-r{display:flex;align-items:center;gap:4px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good)} .dot.err{background:var(--warn)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:36px;padding:0 10px;font-size:13px;font-weight:600;color:var(--accent)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--muted);font:600 14px/1 var(--body);padding:9px 12px;border-radius:999px;background:var(--bg);display:flex;gap:6px;align-items:center}
nav a.on{background:var(--accent);color:var(--on-accent)}
nav a small{font-weight:500;opacity:.8;font-size:12px}

main{max-width:1100px;margin:0 auto;padding:14px 16px 96px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font:700 17px/1.2 var(--display);margin:0 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* meta do ano */
.hero{display:grid;gap:10px}
.hero .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font:800 46px/1 var(--display);letter-spacing:-.02em}
.big small{font:600 18px var(--body);color:var(--muted);letter-spacing:0}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--body);padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.bar{position:relative;height:12px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.ok i{background:var(--good)}
.bar.amber i{background:var(--amber)}
.note{font-size:13px;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.tile .val{font:800 26px/1.05 var(--display)}
.tile .val small{font:600 14px var(--body);color:var(--muted)}

/* barras por mês */
.months{display:grid;gap:2px}
.mrow{display:grid;grid-template-columns:44px 1fr 76px;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;text-decoration:none;color:inherit}
.mrow:hover,.mrow:active{background:var(--bg)}
.mrow .m{font-weight:600;font-size:14px}
.mrow .n{text-align:right;font-size:14px;font-weight:600}
.mrow .n small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.track{position:relative;height:22px;background:var(--bg);border-radius:6px}
.track .all{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px}
.track .ent{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px}
.track.ok .all{border-color:var(--good);background:var(--good-soft)} .track.ok .ent{background:var(--good)}
.track .meta{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--amber);border-radius:2px}
.track.empty{opacity:.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* mês */
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mhead h2{font:800 28px/1 var(--display);margin:0}
.navbtns{display:flex;gap:6px}
.btn{font:600 15px var(--body);border-radius:10px;padding:11px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.ghost{background:var(--surface);color:var(--accent);border-color:var(--line)}
.btn.danger{background:var(--surface);color:var(--warn);border-color:var(--warn-soft)}
.btn.danger.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.sq{width:44px;padding:0}
.list{display:grid;gap:8px}
@media (min-width:760px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sale{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;text-align:left;width:100%}
.sale.ok{border-left-color:var(--good)} .sale.pend{border-left-color:var(--amber)}
.sale:hover{border-color:var(--accent)}
.sale .cli{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.sale .meta{font-size:13px;color:var(--muted);grid-column:1}
.sale .qtd{grid-row:1/span 2;grid-column:2;text-align:right;font:800 22px/1 var(--display)}
.sale .qtd small{display:block;font:500 11px var(--body);color:var(--muted)}
.pill{display:inline-block;font:700 11px var(--body);padding:3px 8px;border-radius:999px;vertical-align:1px}
.pill.sim{background:var(--good-soft);color:var(--good)} .pill.nao{background:var(--amber-soft);color:var(--amber)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.22);border-radius:999px;padding:14px 20px;font-size:16px}
.toggle{border:0;font:700 13px var(--body);padding:8px 12px;border-radius:999px}
.toggle.sim{background:var(--good-soft);color:var(--good)} .toggle.nao{background:var(--warn-soft);color:var(--warn)}

/* metas */
.grid-metas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid-metas{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid-metas{grid-template-columns:repeat(6,minmax(0,1fr))}}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;width:100%;min-height:44px;font-size:16px}
.field input[type=number]{text-align:right}
.field.bigf input{font:800 26px var(--display);text-align:left}
.sumline{font-size:13px;color:var(--muted);margin-top:8px}
.sumline b{color:var(--ink)}
.sumline.bad b{color:var(--warn)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ficha */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
@media (min-width:640px){.overlay{align-items:center;padding:16px}.sheet{border-radius:18px}}
.sheet h3{font:800 20px var(--display);margin:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 0}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.stepper button{border:1px solid var(--line);background:var(--bg);border-radius:10px;font:700 22px var(--body)}
.stepper input{text-align:center!important;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:48px}
.err{color:var(--warn);font-size:14px;min-height:1em;margin:0}
.by{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

/* entrada */
.login{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px 16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:400px;display:grid;gap:14px}
.login img{width:56px;height:56px;border-radius:14px}
.login h2{font:800 24px/1.15 var(--display);margin:0}
.share code{display:block;font:700 18px/1.3 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;word-break:break-all}
.hidden{display:none!important}
/* filtros, seleção, entrega */
.toolbar{display:grid;gap:8px}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg span{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 6px 0 8px;white-space:nowrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 11px;font:600 13px var(--body);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.count{font-size:13px;color:var(--muted)}
.search{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px}
.search:focus-within{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.search input{flex:1;border:0;background:transparent;padding:12px 0;font-size:16px;min-width:0;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.sale .tel{font-weight:500;font-size:13px;color:var(--accent);white-space:nowrap}
@media (max-width:480px){.cli-tel{grid-template-columns:1fr}}
.linkbtn{border:0;background:none;color:var(--accent);font:600 14px var(--body);padding:6px 4px}
.sale{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;text-align:left;width:100%}
.sale .open{all:unset;cursor:pointer;display:grid;gap:3px;min-width:0;grid-column:1}
.sale .open:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sale .qtd{grid-row:1;grid-column:2}
.sale .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.act{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font:700 12.5px var(--body);min-height:38px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.ent-nao{background:var(--surface);color:var(--amber);border:2px solid var(--amber)}
.act.ent-nao:hover,.act.ent-nao:active{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.act.ent-sim{background:var(--good);color:#fff;border-color:var(--good)}
.act.pg-sim{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}
.act.pg-nao{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
.act.maq{font-weight:600;color:var(--ink)} .act.maq.vazio{color:var(--muted)}
.sale.sel{outline:3px solid var(--accent);background:var(--accent-soft)}
.selbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:inline-grid;place-items:center;font:800 15px/1 var(--body);color:var(--on-accent);flex:none}
.sale.sel .selbox{background:var(--accent);border-color:var(--accent)}
.sale.selmode{cursor:pointer}
.sale.selmode .acts{display:none}
.bulk{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:grid;gap:8px;max-width:620px;margin:0 auto}
body.selmode-on main{padding-bottom:240px}
.bulk .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bulk .btn{min-height:42px;padding:8px 10px;font-size:14px}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:13px;font:700 16px var(--body)}
.yn button.on.s{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.yn button.on.n{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.comp{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.comp img{max-width:100%;border-radius:8px;display:block}
.comp a{color:var(--accent);font-weight:600;word-break:break-all}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:0}
.maqs{display:grid;gap:8px}
.maqrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:end}
.maqrow b{font:700 14px var(--display);padding-bottom:12px;color:var(--muted)}
.bonus .ln{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.bonus .ln:last-child{border-bottom:0;font-weight:700;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;font-size:14px;z-index:30;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:420px){.status span.t{display:none}.big{font-size:40px}}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="top">
    <h1><img src="icon.svg" alt="">Metas <span id="anoTit" style="color:var(--accent)">2026</span></h1>
    <div class="top-r">
      <span class="status"><span class="dot" id="dot"></span><span class="t" id="statusTxt">Conectando…</span></span>
      <button class="iconbtn" id="shareBtn" type="button">Compartilhar</button>
      <button class="iconbtn" id="outBtn" type="button" aria-label="Sair">Sair</button>
    </div>
  </div>
  <nav id="nav" aria-label="Períodos"></nav>
</header>
<main id="main"></main>
<div id="layer"></div>

<script src="config.js"></script>
<script>
(function(){
const CFG=window.METAS_CONFIG||{};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const SLUG=["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DEF={ano:2026,metaAno:200,metaSemestre:{1:100,2:100},metaMes:{},comissaoPaga:{},meta1:100,meta2:200,valor1:0,valor2:0};
let vendas=[],cfg={...DEF},pollTimer=null,busy=0,pendingRender=false,editing=null;
let filt={ent:"todos",pag:"todos"},selMode=false,busca="",listCtx=null;const sel=new Set();
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=n=>((Number(n)||0)*100).toLocaleString("pt-BR",{maximumFractionDigits:0})+"%";
const num=n=>(Number(n)||0).toLocaleString("pt-BR");
const fmtD=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return `${dd}/${m}`};
const pad=n=>String(n).padStart(2,"0");

// ---- login guardado no aparelho ----
const cookie={get(k){try{const m=document.cookie.match(new RegExp("(?:^|; )"+k.replace(/\./g,"\\.")+"=([^;]*)"));return m?decodeURIComponent(m[1]):null}catch(e){return null}},
  set(k,v){try{document.cookie=k+"="+encodeURIComponent(v)+"; max-age=34560000; path=/; SameSite=Lax; Secure"}catch(e){}},
  del(k){try{document.cookie=k+"=; max-age=0; path=/; SameSite=Lax; Secure"}catch(e){}}};
const store={get(k){let v=null;try{v=localStorage.getItem(k)}catch(e){}if(v==null)v=cookie.get(k);return v},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}cookie.set(k,v)},del(k){try{localStorage.removeItem(k)}catch(e){}cookie.del(k)}};
let ME=store.get("metas.name")||"",CODE=store.get("metas.code")||"";

async function rpc(fn,args){
  const r=await fetch(CFG.supabaseUrl+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json","apikey":CFG.supabaseKey},body:JSON.stringify(Object.assign({p_code:CODE},args||{}))});
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok){const msg=(data&&(data.message||data.hint))||("HTTP "+r.status);const err=new Error(msg);err.badCode=/codigo_invalido/.test(msg);throw err}
  return data;
}
const normV=v=>({...v,quantidade:+v.quantidade||0,preco:v.preco==null?null:+v.preco,comissao:v.comissao==null?null:+v.comissao,parcelaValor:v.parcelaValor==null?null:+v.parcelaValor,pago:!!v.pago,maquinas:Array.isArray(v.maquinas)?v.maquinas:[]});
function applyCfg(c){cfg={...DEF,...(c||{})};["meta1","meta2","valor1","valor2"].forEach(k=>cfg[k]=Number(cfg[k])||0);cfg.metaSemestre={...DEF.metaSemestre,...(cfg.metaSemestre||{})};cfg.metaMes={...(cfg.metaMes||{})};cfg.comissaoPaga={...(cfg.comissaoPaga||{})}}
async function load(){const d=await rpc("metas_list");applyCfg(d&&d.config);vendas=(d&&d.vendas||[]).map(normV)}

// ---- metas por período ----
const metaMes=m=>{const v=Number(cfg.metaMes[m]);return v>0?v:Math.round(cfg.metaAno/12)};
const metaSem=s=>{const v=Number(cfg.metaSemestre[s]);return v>0?v:Math.round(cfg.metaAno/2)};
const doMes=m=>vendas.filter(v=>v.mes===m&&v.ano===cfg.ano).sort((a,b)=>(a.data||"").localeCompare(b.data||"")||(a.ordem||0)-(b.ordem||0));
function somar(l){let q=0,qe=0,tot=0,com=0,pg=0,ent=0;for(const v of l){q+=v.quantidade;if(v.entregue){qe+=v.quantidade;ent++}if(v.pago)pg++;const t=(+v.preco||0)*v.quantidade;tot+=t;com+=t*(+v.comissao||0)/100}return{l,n:l.length,q,qe,tot,com,pg,ent}}
const resumo=m=>somar(doMes(m));
const doAno=()=>vendas.filter(v=>v.ano===cfg.ano).sort((a,b)=>(a.data||"").localeCompare(b.data||"")||(a.ordem||0)-(b.ordem||0));
const passa=v=>(filt.ent==="todos"||(filt.ent==="sim")===!!v.entregue)&&(filt.pag==="todos"||(filt.pag==="sim")===!!v.pago);
const filtroAtivo=()=>filt.ent!=="todos"||filt.pag!=="todos";
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function fmtTel(t){const d=String(t||"").replace(/\D/g,"");if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return String(t||"")}
function passaBusca(v){const q=norm(busca).trim();if(!q)return true;
  if(norm(v.cliente).includes(q))return true;
  const[y,m,d]=(v.data||"").split("-");if(`${d}/${m}/${y}`.includes(q)||(v.data||"").includes(q))return true;
  const dig=q.replace(/\D/g,"");if(dig.length>=3&&String(v.telefone||"").replace(/\D/g,"").includes(dig))return true;
  return false}
// bônus: máquinas entre a Meta 1 e a Meta 2 valem valor1 cada; acima da Meta 2 valem valor2 cada
function bonus(total){const m1=cfg.meta1||0,m2=Math.max(cfg.meta2||0,m1);const n1=Math.max(0,Math.min(total,m2)-m1),n2=Math.max(0,total-m2);
  const b1=n1*(cfg.valor1||0),b2=n2*(cfg.valor2||0);return{m1,m2,n1,n2,b1,b2,tot:b1+b2}}
const listaMaq=v=>{const q=Math.max(1,Math.floor(+v.quantidade||0));const a=Array.isArray(v.maquinas)?v.maquinas:[];return Array.from({length:q},(_,i)=>({galga:"",serie:"",...(a[i]||{})}))};
function resumoMaq(v){const g=listaMaq(v).map(x=>(x.galga||"").trim());const n=g.length;
  return g.some(Boolean)?`${n>1?n+" máq. · ":""}Galga ${g.map(x=>x||"?").join(", ")}`:(n>1?`${n} máquinas · informar galgas`:"Informar galga")}
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),6000)}

function setStatus(k,t){$("#dot").className="dot "+(k||"");$("#statusTxt").textContent=t}
function route(){const h=(location.hash||"").slice(1);if(h==="metas")return"metas";if(h==="todas")return"todas";const i=SLUG.indexOf(h);return i>=0?i+1:0}

// ---- entrada ----
function showLogin(msg){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null}
  $("#hdr").classList.add("hidden");$("#layer").innerHTML="";
  $("#main").className="login";
  $("#main").innerHTML=`<form id="lf" novalidate>
    <img src="icon.svg" alt="">
    <h2>Vendas de Máquinas</h2>
    <p class="sub" style="margin:0">Digite seu nome e o código que você recebeu. O aparelho lembra nas próximas vezes.</p>
    <div class="field"><label for="l-name">Seu nome</label><input id="l-name" maxlength="40" autocomplete="name" value="${esc(ME)}" placeholder="Ex.: Isaac"></div>
    <div class="field"><label for="l-code">Código de acesso</label><input id="l-code" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(CODE)}" placeholder="palavra-palavra-palavra-12345"></div>
    <p class="err" id="l-err" role="alert">${esc(msg||"")}</p>
    <button class="btn" id="l-go" type="submit">Entrar</button>
  </form>`;
  $("#lf").addEventListener("submit",async e=>{
    e.preventDefault();const n=$("#l-name").value.trim(),c=$("#l-code").value.trim().toLowerCase();
    if(!n){$("#l-err").textContent="Digite seu nome.";return}
    if(!c){$("#l-err").textContent="Digite o código de acesso.";return}
    $("#l-go").disabled=true;$("#l-err").textContent="Conferindo…";ME=n;CODE=c;
    try{await load();store.set("metas.name",ME);store.set("metas.code",CODE);startApp()}
    catch(err){$("#l-go").disabled=false;$("#l-err").textContent=err.badCode?"Código não confere. Confira com quem te enviou.":"Sem conexão. Verifique a internet e tente de novo."}
  });
}
function startApp(){
  $("#hdr").classList.remove("hidden");$("#main").className="";setStatus("live","Sincronizado");
  if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden)refresh()},15000);render();
}
async function refresh(){
  if(busy||editing)return;
  try{await load();setStatus("live","Sincronizado");render()}
  catch(e){if(e.badCode){store.del("metas.code");CODE="";showLogin("O código de acesso mudou. Peça o novo código para quem compartilhou.");return}setStatus("err","Sem conexão")}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pollTimer)refresh()});

// ---- telas ----
function renderNav(){const r=route();
  const a=(href,on,txt)=>`<a href="#${href}" class="${on?"on":""}">${txt}</a>`;
  $("#nav").innerHTML=a("geral",r===0,"Visão geral")+a("todas",r==="todas","Todas as vendas")+MESES.map((n,i)=>a(SLUG[i],r===i+1,`${n.slice(0,3)} <small>${resumo(i+1).q||""}</small>`)).join("")+a("metas",r==="metas","Metas");
  const on=$("#nav a.on");if(on)on.scrollIntoView({block:"nearest",inline:"center"});
}
function render(){
  if(!pollTimer)return;
  const ae=document.activeElement;if(ae&&ae.closest&&ae.closest("#main input")){pendingRender=true;if(ae.id==="busca")atualizaLista();return}
  pendingRender=false;$("#anoTit").textContent=cfg.ano;renderNav();
  const ids=new Set(vendas.map(v=>v.id));[...sel].forEach(id=>{if(!ids.has(id))sel.delete(id)});
  const r=route();$("#main").innerHTML=r==="metas"?viewMetas():r==="todas"?viewTodas():r?viewMes(r):viewGeral();
  $("#layer").querySelector(".fab")?.remove();$("#layer").querySelector(".bulk")?.remove();document.body.classList.toggle("selmode-on",selMode);
  if(selMode&&(r==="todas"||typeof r==="number"&&r>0)){$("#layer").insertAdjacentHTML("beforeend",bulkBar())}
  else if(typeof r==="number"&&r>0){const b=document.createElement("button");b.className="btn fab";b.type="button";b.textContent="+ Nova venda";b.onclick=()=>openSheet(null,r);$("#layer").appendChild(b)}
}
function bulkBar(){const n=sel.size;return `<div class="bulk" role="region" aria-label="Ações nas vendas selecionadas">
  <div class="toolrow"><b>${n?n+" selecionada"+(n>1?"s":""):"Toque nas vendas para selecionar"}</b><button class="linkbtn" data-sel="fim" type="button">Concluir</button></div>
  <div class="g"><button class="btn ok" data-bulk="entregue:1" type="button" ${n?"":"disabled"}>✓ Entregue</button><button class="btn ghost" data-bulk="entregue:0" type="button" ${n?"":"disabled"}>A entregar</button></div>
  <div class="g"><button class="btn" data-bulk="pago:1" type="button" ${n?"":"disabled"}>✓ 1ª parcela paga</button><button class="btn ghost" data-bulk="pago:0" type="button" ${n?"":"disabled"}>Não paga</button></div>
</div>`}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender)render()},0));
addEventListener("hashchange",()=>{pendingRender=false;sel.clear();selMode=false;document.activeElement?.blur?.();render();scrollTo(0,0)});

function viewGeral(){
  const rs=MESES.map((_,i)=>resumo(i+1));const total=rs.reduce((s,r)=>s+r.q,0),ent=rs.reduce((s,r)=>s+r.qe,0);
  const s1=rs.slice(0,6).reduce((s,r)=>s+r.q,0),s2=rs.slice(6).reduce((s,r)=>s+r.q,0);
  const hoje=new Date();const mAtual=hoje.getFullYear()===cfg.ano?hoje.getMonth()+1:12;const ra=rs[mAtual-1];
  const okAno=total>=cfg.metaAno;const bn=bonus(total);const ra2=rs.reduce((s,r)=>({n:s.n+r.n,pg:s.pg+r.pg}),{n:0,pg:0});const nv=ra2.n,npg=ra2.pg;
  const tile=(lbl,q,meta,href)=>{const ok=q>=meta;return `<a class="tile" href="#${href}" style="text-decoration:none;color:inherit"><span class="lbl">${lbl}</span><span class="val">${q} <small>/ ${meta}</small></span><div class="bar ${ok?"ok":""}"><i style="width:${Math.min(100,meta?q/meta*100:0)}%"></i></div><span class="note">${ok?"✓ Meta batida":"Faltam "+(meta-q)}</span></a>`};
  const maxQ=Math.max(...rs.map(r=>r.q),...MESES.map((_,i)=>metaMes(i+1)),1)*1.08;
  return `
  <section class="card hero">
    <div class="row"><span class="lbl">Meta do ano ${cfg.ano}</span>${okAno?`<span class="badge ok">✓ Meta batida · +${total-cfg.metaAno} máquinas</span>`:`<span class="badge">Faltam ${cfg.metaAno-total} máquinas</span>`}</div>
    <div class="row"><span class="big">${total} <small>de ${cfg.metaAno} máquinas</small></span><span class="big" style="font-size:30px;color:${okAno?"var(--good)":"var(--accent)"}">${pct(total/cfg.metaAno)}</span></div>
    <div class="bar ${okAno?"ok":""}"><i style="width:${Math.min(100,total/cfg.metaAno*100)}%"></i></div>
    <span class="note">${ent} entregues · ${total-ent} a entregar · <a href="#metas" style="color:var(--accent)">editar metas</a></span>
  </section>
  <section class="tiles">
    ${tile("1º semestre",s1,metaSem(1),"metas")}
    ${tile("2º semestre",s2,metaSem(2),"metas")}
    ${tile(MESES[mAtual-1],ra.q,metaMes(mAtual),SLUG[mAtual-1])}
    <div class="tile"><span class="lbl">Entregues</span><span class="val">${ent} <small>/ ${total}</small></span><div class="bar"><i style="width:${total?ent/total*100:0}%;background:var(--good)"></i></div><span class="note">${pct(total?ent/total:0)} do total</span></div>
    <a class="tile" href="#todas" data-quick="pag:nao" style="text-decoration:none;color:inherit"><span class="lbl">1ª parcela paga</span><span class="val">${npg} <small>/ ${nv} vendas</small></span><div class="bar"><i style="width:${nv?npg/nv*100:0}%;background:var(--good)"></i></div><span class="note">${nv-npg?`Ver ${nv-npg} não pagas ›`:"✓ Todas pagas"}</span></a>
    <a class="tile" href="#metas" style="text-decoration:none;color:inherit"><span class="lbl">Bônus de metas</span><span class="val" style="font-size:22px">${brl(bn.tot)}</span><span class="note">${bn.n1+bn.n2} máq. acima da Meta 1 (${bn.m1})</span></a>
  </section>
  <section class="card">
    <h2>Máquinas por mês</h2>
    <p class="sub">Toque em um mês para ver e editar as vendas.</p>
    <div class="months">${rs.map((r,i)=>{const mm=metaMes(i+1),ok=r.q>=mm&&r.q>0;
      return `<a class="mrow" href="#${SLUG[i]}" aria-label="${MESES[i]}: ${r.q} de ${mm}">
        <span class="m">${MESES[i].slice(0,3)}</span>
        <span class="track ${ok?"ok":""} ${r.q?"":"empty"}">${r.q?`<span class="all" style="width:${r.q/maxQ*100}%"></span><span class="ent" style="width:${r.qe/maxQ*100}%"></span>`:""}<span class="meta" style="left:${mm/maxQ*100}%"></span></span>
        <span class="n">${r.q} / ${mm}<small>${r.q?(ok?"✓ batida":pct(r.q/mm)):"–"}</small></span></a>`}).join("")}</div>
    <div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Entregues</span><span><i class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></i>A entregar</span><span><i class="sw" style="background:var(--good)"></i>Meta do mês batida</span><span><i class="sw" style="background:var(--amber);width:4px"></i>Meta do mês</span></div>
  </section>`;
}

function seg(k,lbl,ops){return `<div class="seg" role="group" aria-label="${lbl}"><span>${lbl}</span>${ops.map(([v,t])=>`<button type="button" data-fil="${k}:${v}" class="${filt[k]===v?"on":""}" aria-pressed="${filt[k]===v}">${t}</button>`).join("")}</div>`}
function toolbar(n,shown){if(!n)return"";return `<div class="toolbar">
  <div class="search"><input id="busca" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar por nome, data (17/11) ou telefone" value="${esc(busca)}" aria-label="Buscar por nome, data ou telefone">${busca?`<button type="button" class="linkbtn" data-busca="limpar" aria-label="Limpar busca">✕</button>`:""}</div>
  ${seg("ent","Entrega",[["todos","Todas"],["sim","Entregues"],["nao","A entregar"]])}
  ${seg("pag","1ª parcela",[["todos","Todas"],["sim","Pagas"],["nao","Não pagas"]])}
  <div class="toolrow"><span class="count" id="cnt">${contagem(n,shown)}</span>
    ${selMode?`<button class="linkbtn" data-sel="todas" type="button">Selecionar todas mostradas</button>`:`<button class="btn ghost" data-sel="ini" type="button" style="min-height:38px;padding:6px 12px;font-size:14px">☑ Selecionar várias</button>`}</div>
</div>`}
function cartao(v,mostraMes){const who=v.editedBy||v.createdBy;const extra=[v.produto,v.preco?brl(v.preco):""].filter(Boolean).join(" · ");const s=sel.has(v.id);
  const rm=resumoMaq(v);
  return `<div class="sale ${v.entregue?"ok":"pend"} ${selMode?"selmode":""} ${s?"sel":""}" data-id="${esc(v.id)}" ${selMode?`role="checkbox" aria-checked="${s}" tabindex="0"`:""}>
    <button class="open" type="button" data-open ${selMode?'tabindex="-1"':""}>
      <span class="cli">${selMode?`<span class="selbox" aria-hidden="true">${s?"✓":""}</span> `:""}${esc(v.cliente)||"<i style='color:var(--muted)'>Sem nome</i>"}${v.telefone?` <span class="tel">📞 ${esc(fmtTel(v.telefone))}</span>`:""}</span>
      <span class="meta">${fmtD(v.data)}${mostraMes?"/"+String(v.ano).slice(2):""}${extra?" · "+esc(extra):""}${who?` · por ${esc(who)}`:""}</span>
    </button>
    <span class="qtd">${v.quantidade}<small>${v.quantidade===1?"máquina":"máquinas"}</small></span>
    <div class="acts">
      <button class="act ${v.entregue?"ent-sim":"ent-nao"}" type="button" data-ent>${v.entregue?"✓ Entregue":"A entregar"}</button>
      <button class="act ${v.pago?"pg-sim":"pg-nao"}" type="button" data-pag>1ª parcela: ${v.pago?"paga"+(v.parcelaValor?" · "+brl(v.parcelaValor):""):"não paga"}${v.comprovanteId?" 📎":""}</button>
      <button class="act maq ${rm.startsWith("Galga")||rm.includes("· Galga")?"":"vazio"}" type="button" data-maq>${esc(rm)}</button>
    </div>
  </div>`}
function contagem(n,shown){return `Mostrando ${shown} de ${n} venda${n===1?"":"s"}${filtroAtivo()||busca?` · <button class="linkbtn" data-fil="limpar" type="button">limpar filtros</button>`:""}`}
function listaHTML(){const{l,vazio,mostraMes}=listCtx;const lf=l.filter(v=>passa(v)&&passaBusca(v));
  return{n:l.length,shown:lf.length,html:lf.length?lf.map(v=>cartao(v,mostraMes)).join(""):`<div class="card empty">${l.length?(busca?`Nada encontrado para “${esc(busca)}”.`:"Nenhuma venda com esses filtros."):vazio}</div>`}}
function lista(l,vazio,mostraMes){listCtx={l,vazio,mostraMes};const r=listaHTML();
  return `${toolbar(r.n,r.shown)}<div class="list" id="lst">${r.html}</div>`}
function atualizaLista(){if(!listCtx||!$("#lst"))return;const r=listaHTML();$("#lst").innerHTML=r.html;const c=$("#cnt");if(c)c.innerHTML=contagem(r.n,r.shown)}
document.addEventListener("input",e=>{if(e.target.id==="busca"){busca=e.target.value;atualizaLista();
  const s=e.target.parentElement;const x=s.querySelector("[data-busca]");if(busca&&!x)s.insertAdjacentHTML("beforeend",`<button type="button" class="linkbtn" data-busca="limpar" aria-label="Limpar busca">✕</button>`);if(!busca&&x)x.remove()}});

function viewMes(m){
  const r=resumo(m),mm=metaMes(m),ok=r.q>=mm;const paga=!!cfg.comissaoPaga[m];
  return `
  <div class="mhead"><div><span class="lbl">${cfg.ano} · ${m<=6?"1º":"2º"} semestre</span><h2>${MESES[m-1]}</h2></div>
    <div class="navbtns">${m>1?`<a class="btn ghost sq" href="#${SLUG[m-2]}" aria-label="${MESES[m-2]}">‹</a>`:""}${m<12?`<a class="btn ghost sq" href="#${SLUG[m]}" aria-label="${MESES[m]}">›</a>`:""}</div></div>
  <section class="card hero">
    <div class="row"><span class="lbl">Máquinas vendidas</span>${ok?`<span class="badge ok">✓ Meta batida${r.q>mm?" · +"+(r.q-mm):""}</span>`:`<span class="badge">Faltam ${mm-r.q}</span>`}</div>
    <div class="row"><span class="big">${r.q} <small>de ${mm} máquinas</small></span>
      <div class="field" style="width:110px"><label for="mm-in">Meta do mês</label><input id="mm-in" type="number" inputmode="numeric" min="1" data-metames="${m}" value="${mm}"></div></div>
    <div class="bar ${ok?"ok":""}"><i style="width:${Math.min(100,mm?r.q/mm*100:0)}%"></i></div>
    <span class="note">${r.n} vendas · ${r.qe} entregues · ${r.q-r.qe} a entregar · 1ª parcela paga em ${r.pg} de ${r.n}${r.tot?` · ${brl(r.tot)} em vendas`:""}</span>
    ${r.com?`<div class="row"><span class="note">Bônus do mês: <b style="color:var(--ink)">${brl(r.com)}</b></span><button class="toggle ${paga?"sim":"nao"}" data-paga="${m}" type="button">${paga?"Bônus pago":"Bônus não pago"}</button></div>`:""}
  </section>
  <section>${lista(r.l,`Nenhuma venda em ${MESES[m-1].toLowerCase()} ainda.<br>Toque em “+ Nova venda” para registrar.`,false)}</section>`;
}

function viewTodas(){
  const l=doAno(),r=somar(l);
  return `
  <div class="mhead"><div><span class="lbl">${cfg.ano} · todos os meses</span><h2>Todas as vendas</h2></div></div>
  <section class="tiles">
    <div class="tile"><span class="lbl">Vendas</span><span class="val">${r.n} <small>${r.q} máq.</small></span></div>
    <div class="tile"><span class="lbl">A entregar</span><span class="val">${r.n-r.ent} <small>vendas</small></span></div>
    <div class="tile"><span class="lbl">1ª parcela não paga</span><span class="val">${r.n-r.pg} <small>vendas</small></span></div>
    <div class="tile"><span class="lbl">Entregues</span><span class="val">${r.ent} <small>vendas</small></span></div>
  </section>
  <p class="note" style="margin:0">Use os filtros para achar quem falta entregar ou pagar a 1ª parcela. Para lançar uma venda nova, abra o mês.</p>
  <section>${lista(l,"Nenhuma venda registrada ainda.",true)}</section>`;
}

function viewMetas(){
  const somaMes=MESES.reduce((s,_,i)=>s+metaMes(i+1),0),somaS1=MESES.slice(0,6).reduce((s,_,i)=>s+metaMes(i+1),0),somaS2=MESES.slice(6).reduce((s,_,i)=>s+metaMes(i+7),0);
  const inp=(id,attr,val,label)=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" inputmode="numeric" min="1" ${attr} value="${val}"></div>`;
  return `
  <section class="card">
    <h2>Metas de ${cfg.ano}</h2>
    <p class="sub">Número de máquinas. Toque fora do campo para salvar; todos veem a mudança.${cfg.updatedBy?` Última alteração: ${esc(cfg.updatedBy)}.`:""}</p>
    <div class="row2">
      <div class="field bigf"><label for="m-ano">Meta do ano</label><input id="m-ano" type="number" inputmode="numeric" min="1" data-cfg="metaAno" value="${cfg.metaAno}"></div>
      ${inp("m-y","data-cfg=\"ano\"",cfg.ano,"Ano")}
    </div>
  </section>
  <section class="card">
    <h2>Por semestre</h2>
    <p class="sub">Jan–Jun e Jul–Dez.</p>
    <div class="row2">${inp("m-s1","data-sem=\"1\"",metaSem(1),"1º semestre")}${inp("m-s2","data-sem=\"2\"",metaSem(2),"2º semestre")}</div>
    <p class="sumline ${metaSem(1)+metaSem(2)!==cfg.metaAno?"bad":""}">Soma dos semestres: <b>${metaSem(1)+metaSem(2)}</b> · meta do ano: <b>${cfg.metaAno}</b></p>
  </section>
  <section class="card">
    <h2>Por mês</h2>
    <p class="sub">A meta de cada mês também pode ser mudada dentro da página do mês.</p>
    <div class="grid-metas">${MESES.map((n,i)=>inp("mm-"+(i+1),`data-metames="${i+1}"`,metaMes(i+1),n)).join("")}</div>
    <p class="sumline ${somaMes!==cfg.metaAno?"bad":""}">Soma dos meses: <b>${somaMes}</b> (1º sem. ${somaS1} · 2º sem. ${somaS2}) · meta do ano: <b>${cfg.metaAno}</b></p>

function bulkApply(val){const[f,b]=val.split(":");const nv=b==="1";let ids=[...sel];if(!ids.length)return;let pul=0;
  if(f==="entregue"&&nv){const ok=ids.filter(id=>vendas.find(x=>x.id===id)?.pago);pul=ids.length-ok.length;ids=ok}
  sel.clear();selMode=false;
  ids.forEach(id=>{const v=vendas.find(x=>x.id===id);if(v){v[f]=nv;if(f==="pago")v.parcelaInformada=true}});render();
  if(ids.length)write(async()=>{const rows=await rpc("metas_bulk",{p_ids:ids,p_campo:f,p_valor:nv,p_author:ME});(rows||[]).map(normV).forEach(row=>{const i=vendas.findIndex(x=>x.id===row.id);if(i>=0)vendas[i]=row});render()});
  if(pul)toast(`${pul} venda${pul>1?"s":""} sem a 1ª parcela paga ${pul>1?"ficaram":"ficou"} como “a entregar”. Toque em “A entregar” no cartão para registrar o pagamento.`);
}

const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=no;r.readAsDataURL(blob)});
async function prepararArquivo(f){
  if(/^image\//.test(f.type)){try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));if(blob)return{dados:await b64(blob),tipo:"image/jpeg",nome:f.name.replace(/\.[^.]+$/,"")+".jpg"}}catch(e){}}
  if(f.size>2.8*1024*1024)throw new Error("grande");
  return{dados:await b64(f),tipo:f.type||"application/octet-stream",nome:f.name};
}
function openEntrega(v,modo){
  const st={pago:v.pago?true:(v.parcelaInformada?false:null),valor:v.parcelaValor??"",compId:v.comprovanteId||null,compNome:v.comprovanteNome||"",up:false,erro:"",ver:null};

    const vi=ov.querySelector("#e-val");if(vi)st.valor=vi.value;
    const tit=ent?(v.entregue?"Máquina entregue":"Registrar entrega"):"1ª parcela";

    if(st.up)comp=`<span class="note">Enviando comprovante…</span>`;

      <div class="grab"></div>
      <div><h3 id="e-tit">${tit}</h3><p class="sub" style="margin:4px 0 0">${esc(v.cliente||"Sem nome")} · ${v.quantidade} máq.${v.produto?" · "+esc(v.produto):""} · ${fmtD(v.data)}</p></div>
      <div style="font-weight:600">A 1ª parcela já foi paga?</div>
      <div class="yn"><button type="button" class="s ${st.pago===true?"on":""}" data-e="sim" aria-pressed="${st.pago===true}">Sim, paga</button><button type="button" class="n ${st.pago===false?"on":""}" data-e="nao" aria-pressed="${st.pago===false}">Não</button></div>
      <div class="field"><label for="e-val">Valor da 1ª parcela (R$)</label><input id="e-val" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(st.valor)}" placeholder="0,00"></div>

      ${st.erro?`<p class="aviso">${esc(st.erro)}</p>`:""}
      ${ent&&!v.entregue&&st.pago!==true?`<p class="aviso">${st.pago===false?"Sem a 1ª parcela paga a máquina não pode ser marcada como entregue. Salve a informação e entregue depois.":"Responda se a 1ª parcela já foi paga para liberar a entrega."}</p>`:""}
      <div style="display:grid;gap:8px">
        ${ent&&!v.entregue?`<button class="btn ok" type="button" data-e="entregar" ${st.pago===true&&!st.up?"":"disabled"}>✓ Tudo certo — marcar como entregue</button><button class="btn ghost" type="button" data-e="salvar" ${st.up?"disabled":""}>Salvar sem entregar</button>`
          :ent?`<button class="btn" type="button" data-e="salvar" ${st.up?"disabled":""}>Salvar</button><button class="btn ghost" type="button" data-e="desentregar">Voltar para “a entregar”</button>`
          :`<button class="btn" type="button" data-e="salvar" ${st.up?"disabled":""}>Salvar</button>`}
        <button class="linkbtn" type="button" data-e="fechar" style="justify-self:center">Cancelar</button>
      </div></div>`;
  }
  async function salvar(extra){
    const raw=ov.querySelector("#e-val")?.value??st.valor;
    const body={pago:st.pago===true,parcelaInformada:st.pago!==null,parcelaValor:raw===""?null:Number(raw),comprovanteId:st.compId||"",comprovanteNome:st.compId?st.compNome:"",...extra};
    ov.querySelectorAll("button").forEach(b=>b.disabled=true);
    try{const row=normV(await rpc("metas_save",{p_id:v.id,p_data:body,p_author:ME}));const i=vendas.findIndex(x=>x.id===row.id);if(i>=0)vendas[i]=row;close();setStatus("live","Salvo")}
    catch(e){st.erro=e.badCode?"O código mudou. Entre de novo.":"Não foi possível salvar. Verifique a internet.";draw()}
  }
  ov.addEventListener("click",async e=>{
    if(e.target===ov){close();return}
    const b=e.target.closest("[data-e]");if(!b)return;const a=b.dataset.e;
    if(a==="fechar")return close();
    if(a==="sim"||a==="nao"){st.pago=a==="sim";st.erro="";draw();return}
    if(a==="tirar"){st.compId=null;st.compNome="";st.ver=null;draw();return}
    if(a==="ver"){if(st.ver){st.ver=null;draw();return}
      try{b.textContent="Abrindo…";const c=await rpc("metas_comp_get",{p_id:st.compId});if(!c||!c.dados)throw 0;
        if(/^image\//.test(c.tipo))st.ver=`<img src="${c.dados}" alt="Comprovante">`;
        else{const blob=await (await fetch(c.dados)).blob();st.ver=`<a href="${URL.createObjectURL(blob)}" target="_blank" rel="noopener" download="${esc(c.nome||"comprovante.pdf")}">Abrir ${esc(c.nome||"comprovante")}</a>`}
      }catch(err){st.erro="Não foi possível abrir o comprovante."}draw();return}
    if(a==="entregar"){if(st.pago===true)salvar({entregue:true});return}

  ov.addEventListener("change",async e=>{
    if(e.target.id!=="e-file")return;const f=e.target.files&&e.target.files[0];if(!f)return;
    st.up=true;st.erro="";draw();
    try{const a=await prepararArquivo(f);const id=await rpc("metas_comp_save",{p_venda:v.id,p_nome:a.nome,p_tipo:a.tipo,p_dados:a.dados,p_author:ME});st.compId=id;st.compNome=a.nome}
    catch(err){st.erro=err&&err.message==="grande"?"Arquivo grande demais (máximo 2,8 MB para PDF).":"Não foi possível enviar o comprovante. Tente de novo."}
    st.up=false;draw();
  });
  draw();setTimeout(()=>ov.querySelector("[data-e]")?.focus(),60);
}

// ---- atualização automática: quando sai versão nova no GitHub, o app recarrega sozinho ----
const VERSAO="202611171848";
async function checaVersao(){
  try{const v=(await fetch("versao.txt?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"")).trim();
    if(v&&v!==VERSAO&&!editing&&!busy){location.replace(location.pathname+"?v="+encodeURIComponent(v)+location.hash)}}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checaVersao()});
setInterval(()=>{if(!document.hidden)checaVersao()},120000);
setTimeout(checaVersao,1500);

$("#outBtn").addEventListener("click",()=>{store.del("metas.code");CODE="";vendas=[];showLogin("")});
$("#shareBtn").addEventListener("click",()=>{
  const url=location.href.split("#")[0];const txt=`Vendas de Máquinas\nAbra: ${url}\nDigite seu nome e o código: ${CODE}`;
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<div class="sheet share"><div class="grab"></div><h3>Compartilhar</h3><p class="sub" style="margin:0">Mande o link e o código. A pessoa digita o nome dela e o código, sem criar conta.</p><p class="note" style="margin:0;word-break:break-all">${esc(url)}</p><code>${esc(CODE)}</code><div class="actions"><button class="btn" id="cpy" type="button">Copiar link e código</button><button class="btn ghost" id="cls" type="button">Fechar</button></div></div>`;
  $("#layer").appendChild(ov);
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.id==="cls")ov.remove()});
  ov.querySelector("#cpy").onclick=async()=>{try{await navigator.clipboard.writeText(txt);ov.querySelector("#cpy").textContent="Copiado!"}catch(e){ov.querySelector("#cpy").textContent="Copie o código acima"}};
});

if(CODE&&ME){$("#main").innerHTML=`<p class="empty">Carregando…</p>`;load().then(startApp).catch(e=>showLogin(e.badCode?"O código de acesso mudou. Peça o novo código para quem compartilhou.":"Sem conexão. Verifique a internet e tente de novo."))}
else showLogin("");
})();
</script>
