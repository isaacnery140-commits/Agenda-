<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda a Dois</title>
<meta name="theme-color" content="#2d5b8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: calendário do mês à esquerda, painel do dia + próximos à direita; empilha no celular. */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --ink:#1c2430; --muted:#6b7380; --line:#e2e4de;
  --accent:#2d5b8c; --accent-soft:#e6eef7;
  --p0:#3567c9; --p1:#d9822b; --p2:#2f8f6b; --p3:#a04fb3;
  --danger:#b83a3a;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --surface:#1b2028; --ink:#e9ecf1; --muted:#9aa3b0; --line:#2b313b;
    --accent:#7fb0e6; --accent-soft:#223246;
    --p0:#6f9cf0; --p1:#f0a75c; --p2:#5cc29a; --p3:#c98ad8; --danger:#ef7d7d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1b2028; --ink:#e9ecf1; --muted:#9aa3b0; --line:#2b313b;
  --accent:#7fb0e6; --accent-soft:#223246;
  --p0:#6f9cf0; --p1:#f0a75c; --p2:#5cc29a; --p3:#c98ad8; --danger:#ef7d7d;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1120px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.people{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

.banner{padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px}
.banner.warn{background:color-mix(in srgb, var(--p1) 18%, var(--surface))}
.hidden{display:none !important}
.lock{font-size:11px;color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-head h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0;text-transform:capitalize;text-wrap:balance}
.nav{display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--accent-soft)}
.btn.icon{width:36px;padding:7px 0;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekdays div{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day{min-height:78px;border-radius:9px;border:1px solid transparent;background:transparent;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.day:hover{background:var(--accent-soft)}
.day .n{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.out .n{color:var(--muted);opacity:.55}
.day.today .n{background:var(--ink);color:var(--surface)}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.pill{font-size:11px;line-height:1.3;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:color-mix(in srgb, var(--c) 14%, transparent)}
.more{font-size:11px;color:var(--muted)}
@media (max-width:520px){
  .day{min-height:52px;padding:4px;align-items:center}
  .pill{display:none}
  .more{display:none}
  .dots{display:flex !important}
}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}

.side{display:flex;flex-direction:column;gap:16px}
.side h3{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 10px;text-wrap:balance}
.side .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);text-align:left;width:100%}
.ev:hover{background:var(--accent-soft)}
.ev .t{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.ev .t small{display:block;font-weight:400;color:var(--muted)}
.ev .title{font-weight:600}
.ev .meta{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal h3{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--danger);font-size:13px;min-height:1em}
.byline{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}

/* tela de entrada e ajustes de app de celular */
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.gate .modal{animation:none}
.gate p{margin:0;color:var(--muted);font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;border-radius:999px;padding:14px 20px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none}
@media (max-width:520px){ #newBtn{display:none} .fab{display:block} .app{padding-bottom:90px} }
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
</style>
</head>
<body>
<div class="gate hidden" id="gate">
  <form class="modal" id="gateForm" novalidate>
    <h3>Agenda a Dois</h3>
    <p>Digite o código da agenda que vocês combinaram e o seu nome. Isso fica salvo neste celular.</p>
    <div class="field"><label for="g-code">Código da agenda</label><input id="g-code" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="ex.: palavra-palavra-palavra-1234"></div>
    <div class="field"><label for="g-name">Seu nome</label><input id="g-name" maxlength="40" autocomplete="given-name" placeholder="Como o outro vai te ver"></div>
    <div class="err" id="gateErr" role="alert"></div>
    <div class="actions"><div class="r"><button class="btn primary" id="gateBtn" type="submit">Entrar</button></div></div>
  </form>
</div>

<div class="app hidden" id="app">
  <header class="top">
    <div class="brand">
      <h1>Agenda a Dois</h1>
      <p id="status">Conectando…</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="people" id="people"></div>
      <button class="btn primary" id="newBtn" type="button">+ Novo compromisso</button>
    </div>
  </header>

  <div class="banner hidden" id="banner"></div>
  <div class="banner hidden" id="notif" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span id="notifText"></span><button class="btn primary hidden" id="notifBtn" type="button">Ativar notificações</button></div>

  <div class="grid">
    <section class="card" aria-label="Calendário">
      <div class="cal-head">
        <h2 id="monthLabel"></h2>
        <div class="nav">
          <button class="btn icon" id="prev" type="button" aria-label="Mês anterior">‹</button>
          <button class="btn" id="todayBtn" type="button">Hoje</button>
          <button class="btn icon" id="next" type="button" aria-label="Próximo mês">›</button>
        </div>
      </div>
      <div class="weekdays"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div>
      <div class="days" id="days"></div>
    </section>

    <aside class="side">
      <section class="card">
        <div class="head"><h3 id="dayLabel"></h3><button class="btn" id="addDay" type="button">+ Adicionar</button></div>
        <div class="list" id="dayList"></div>
      </section>
      <section class="card">
        <h3>Próximos compromissos</h3>
        <div class="list" id="upcoming"></div>
      </section>
      <p style="margin:0;text-align:center"><button class="linkbtn" id="logout" type="button">Sair desta agenda neste celular</button></p>
    </aside>
  </div>
  <button class="btn primary fab" id="fab" type="button">+ Novo</button>
</div>

<div class="overlay hidden" id="overlay">
  <form class="modal" id="form" novalidate>
    <h3 id="formTitle">Novo compromisso</h3>
    <div class="field"><label for="f-title">Título</label><input id="f-title" maxlength="120" required placeholder="Ex.: Jantar com a família"></div>
    <div class="row">
      <div class="field"><label for="f-date">Data</label><input id="f-date" type="date" required></div>
      <div class="field" style="justify-content:flex-end"><label class="check" for="f-allday"><input id="f-allday" type="checkbox"> Dia inteiro</label></div>
    </div>
    <div class="row" id="timeRow">
      <div class="field"><label for="f-start">Início</label><input id="f-start" type="time" value="09:00"></div>
      <div class="field"><label for="f-end">Fim</label><input id="f-end" type="time" value="10:00"></div>
    </div>
    <div class="field"><label for="f-place">Local</label><input id="f-place" maxlength="120" placeholder="Opcional"></div>
    <div class="field"><label for="f-notes">Observações</label><textarea id="f-notes" maxlength="1000" placeholder="Opcional"></textarea></div>
    <label class="check" id="allowRow" for="f-allow"><input id="f-allow" type="checkbox"> Permitir que a outra pessoa edite</label>
    <div class="byline" id="byline"></div>
    <div class="err" id="formErr" role="alert"></div>
    <div class="actions">
      <button class="btn danger hidden" id="delBtn" type="button">Excluir</button>
      <div class="r">
        <button class="btn" id="cancelBtn" type="button">Cancelar</button>
        <button class="btn primary" id="saveBtn" type="submit">Salvar</button>
      </div>
    </div>
  </form>
</div>

<script src="config.js"></script>
<script>
(function(){
  const CFG = window.AGENDA_CONFIG || {};
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
  const PCOL = ["--p0","--p1","--p2","--p3"];
  // Guarda o login em dois lugares (localStorage e cookie de longa duração), para o celular não esquecer.
  const cookie = {
    get(k){ try{ const m=document.cookie.match(new RegExp("(?:^|; )"+k.replace(/\./g,"\\.")+"=([^;]*)")); return m?decodeURIComponent(m[1]):null; }catch(e){ return null; } },
    set(k,v){ try{ document.cookie=k+"="+encodeURIComponent(v)+"; max-age=34560000; path=/; SameSite=Lax; Secure"; }catch(e){} },
    del(k){ try{ document.cookie=k+"=; max-age=0; path=/; SameSite=Lax; Secure"; }catch(e){} }
  };
  const store = {
    get(k){ let v=null; try{ v=localStorage.getItem(k); }catch(e){} if(v==null){ v=cookie.get(k); if(v!=null){ try{ localStorage.setItem(k,v); }catch(e){} } } else if(cookie.get(k)==null) cookie.set(k,v); return v; },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} cookie.set(k,v); },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} cookie.del(k); }
  };
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

  const S = { events:new Map(), view:new Date(), sel:ymd(new Date()), code:store.get("agenda.code"), me:store.get("agenda.name"), editing:null, loaded:false, timer:null };
  S.view.setDate(1);

  // ---------- API (funções do banco, protegidas pelo código) ----------
  async function rpc(fn, args){
    const r = await fetch(CFG.supabaseUrl+"/rest/v1/rpc/"+fn, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":CFG.supabaseKey },
      body:JSON.stringify(Object.assign({p_code:S.code}, args||{}))
    });
    let data=null; try{ data=await r.json(); }catch(e){}
    if(!r.ok){
      const msg=(data&&(data.message||data.hint))||("HTTP "+r.status);
      const err=new Error(msg); err.badCode=/codigo_invalido/.test(msg); throw err;
    }
    return data;
  }
  const toLocal = x => ({ id:x.id, title:x.title, date:x.date, allDay:!!x.all_day, start:x.start_time||"", end:x.end_time||"", place:x.place||"", notes:x.notes||"", allowEdit:!!x.allow_edit, by:x.created_by||"", editedBy:x.edited_by||"", createdAt:Date.parse(x.created_at)||0 });

  async function refresh(){
    try{
      const rows = await rpc("agenda_list");
      const m=new Map(); (rows||[]).forEach(x=>m.set(x.id,toLocal(x)));
      S.events=m; S.loaded=true; banner("");
      $("status").textContent="Sincronizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      render();
    }catch(e){
      if(e.badCode){ logout("O código da agenda não confere. Digite de novo."); return; }
      $("status").textContent="Sem conexão";
      banner("Não foi possível atualizar a agenda. Verifique a internet; o app tenta de novo sozinho.",true);
    }
  }

  // ---------- elementos ----------
  function el(tag, attrs, ...kids){
    const e=document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==="class") e.className=attrs[k];
      else if(k==="style") e.setAttribute("style",attrs[k]);
      else if(k.startsWith("on")) e.addEventListener(k.slice(2),attrs[k]);
      else e.setAttribute(k,attrs[k]);
    }
    for(const c of kids){ if(c==null) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
    return e;
  }

  // ---------- pessoas e cores ----------
  function creators(){
    const first={};
    for(const ev of S.events.values()){ if(!ev.by) continue; if(!(ev.by in first)||ev.createdAt<first[ev.by]) first[ev.by]=ev.createdAt; }
    if(S.me && !(S.me in first)) first[S.me]=Infinity;
    return Object.keys(first).sort((a,b)=>first[a]-first[b]);
  }
  const colorOf = id => { const i=creators().indexOf(id); return "var("+PCOL[(i<0?0:i)%PCOL.length]+")"; };
  const same = (a,b) => String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
  const isMine = ev => !ev.by || same(ev.by,S.me);
  const canEdit = ev => isMine(ev) || ev.allowEdit;
  const nameOf = id => !id ? "Alguém" : (same(id,S.me) ? id+" (você)" : id);

  // ---------- render ----------
  function byTime(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    const ta=a.allDay?"00:00":(a.start||"99:99"), tb=b.allDay?"00:00":(b.start||"99:99");
    return ta<tb?-1:ta>tb?1:0;
  }
  const eventsOn = date => [...S.events.values()].filter(e=>e.date===date).sort(byTime);

  function renderPeople(){
    const box=$("people"); box.replaceChildren();
    for(const id of creators()) box.append(el("span",{class:"chip"}, el("span",{class:"dot",style:"background:"+colorOf(id)}), same(id,S.me)?"Você":id));
  }
  function renderMonth(){
    const v=S.view;
    $("monthLabel").textContent=v.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    const start=new Date(v.getFullYear(),v.getMonth(),1-v.getDay());
    const today=ymd(new Date());
    const box=$("days"); box.replaceChildren();
    for(let i=0;i<42;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      if(i===35 && d.getMonth()!==v.getMonth()) break;
      const key=ymd(d), evs=eventsOn(key);
      const cls=["day"]; if(d.getMonth()!==v.getMonth()) cls.push("out"); if(key===today) cls.push("today"); if(key===S.sel) cls.push("sel");
      const label=d.toLocaleDateString("pt-BR",{day:"numeric",month:"long"})+(evs.length?", "+evs.length+" compromisso"+(evs.length>1?"s":""):"");
      const b=el("button",{class:cls.join(" "),type:"button","aria-label":label,onclick:()=>{S.sel=key;render();},ondblclick:()=>openForm(null,key)}, el("span",{class:"n"},d.getDate()));
      evs.slice(0,2).forEach(e=>b.append(el("div",{class:"pill",style:"--c:"+colorOf(e.by)},(e.allDay?"":(e.start||"")+" ")+e.title)));
      if(evs.length>2) b.append(el("div",{class:"more"},"+"+(evs.length-2)+" mais"));
      if(evs.length){ const dots=el("div",{class:"dots"}); evs.slice(0,4).forEach(e=>dots.append(el("span",{class:"dot",style:"background:"+colorOf(e.by)}))); b.append(dots); }
      box.append(b);
    }
  }
  function evRow(e, showDate){
    const t=el("div",{class:"t"});
    if(showDate){ t.append(parse(e.date).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","")); t.append(el("small",null,e.allDay?"Dia todo":(e.start||""))); }
    else if(e.allDay) t.append("Dia todo");
    else t.append(e.start||"", el("small",null,e.end?"até "+e.end:""));
    const meta=[same(e.by,S.me)?"Você":(e.by||"Alguém")]; if(e.place) meta.unshift(e.place); if(!canEdit(e)) meta.push("só leitura");
    return el("button",{class:"ev",type:"button",style:"--c:"+colorOf(e.by),onclick:()=>openForm(e)},
      t, el("div",null, el("div",{class:"title"},e.title), el("div",{class:"meta"},meta.join(" · "))));
  }
  function renderSide(){
    const lbl=parse(S.sel).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
    $("dayLabel").textContent=lbl.charAt(0).toUpperCase()+lbl.slice(1);
    const list=$("dayList"); list.replaceChildren();
    const evs=eventsOn(S.sel);
    if(!evs.length) list.append(el("div",{class:"empty"}, S.loaded?"Nada marcado neste dia.":"Carregando…"));
    evs.forEach(e=>list.append(evRow(e,false)));
    const up=$("upcoming"); up.replaceChildren();
    const today=ymd(new Date());
    const next=[...S.events.values()].filter(e=>e.date>=today).sort(byTime).slice(0,6);
    if(!next.length) up.append(el("div",{class:"empty"},S.loaded?"Nenhum compromisso pela frente.":"Carregando…"));
    next.forEach(e=>up.append(evRow(e,true)));
  }
  function render(){ renderPeople(); renderMonth(); renderSide(); }
  function banner(msg,warn){ const b=$("banner"); if(!msg){b.classList.add("hidden");return;} b.textContent=msg; b.classList.toggle("warn",!!warn); b.classList.remove("hidden"); }

  // ---------- formulário ----------
  function openForm(ev, date){
    S.editing=ev||null;
    const editable=!ev||canEdit(ev), mine=!ev||isMine(ev);
    $("formTitle").textContent=!ev?"Novo compromisso":(editable?"Editar compromisso":"Compromisso");
    $("f-title").value=ev?ev.title:"";
    $("f-date").value=ev?ev.date:(date||S.sel);
    $("f-allday").checked=ev?ev.allDay:false;
    $("f-start").value=ev&&ev.start?ev.start:"09:00";
    $("f-end").value=ev&&ev.end?ev.end:"10:00";
    $("f-place").value=ev?ev.place:"";
    $("f-notes").value=ev?ev.notes:"";
    $("f-allow").checked=ev?ev.allowEdit:false;
    $("allowRow").classList.toggle("hidden",!mine);
    $("byline").textContent=ev?("Criado por "+nameOf(ev.by)+(ev.editedBy&&!same(ev.editedBy,ev.by)?" · editado por "+nameOf(ev.editedBy):"")+(editable?"":" · Só "+ev.by+" pode editar este compromisso.")):"";
    ["f-title","f-date","f-allday","f-start","f-end","f-place","f-notes"].forEach(id=>$(id).disabled=!editable);
    $("saveBtn").classList.toggle("hidden",!editable);
    $("cancelBtn").textContent=editable?"Cancelar":"Fechar";
    $("formErr").textContent="";
    $("delBtn").classList.toggle("hidden",!ev||!editable);
    $("delBtn").textContent="Excluir"; $("delBtn").dataset.confirm="";
    syncAllDay();
    $("overlay").classList.remove("hidden");
    if(!ev) setTimeout(()=>$("f-title").focus(),30);
  }
  function closeForm(){ $("overlay").classList.add("hidden"); S.editing=null; }
  function syncAllDay(){ $("timeRow").classList.toggle("hidden",$("f-allday").checked); }
  const saveErr = e => /sem_permissao/.test(e.message||"") ? "Só quem criou este compromisso pode alterá-lo." : e.badCode ? "O código da agenda mudou. Saia e entre de novo." : "Não foi possível salvar. Verifique a internet e tente de novo.";

  $("form").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const title=$("f-title").value.trim(), date=$("f-date").value, allDay=$("f-allday").checked, start=$("f-start").value, end=$("f-end").value;
    if(!title){ $("formErr").textContent="Dê um título ao compromisso."; return; }
    if(!date){ $("formErr").textContent="Escolha uma data."; return; }
    if(!allDay && start && end && end<start){ $("formErr").textContent="O horário de fim é antes do início."; return; }
    $("saveBtn").disabled=true;
    try{
      const row = await rpc("agenda_save",{
        p_id: S.editing?S.editing.id:null, p_title:title, p_date:date, p_all_day:allDay,
        p_start: allDay?null:(start||null), p_end: allDay?null:(end||null),
        p_place:$("f-place").value.trim(), p_notes:$("f-notes").value.trim(), p_author:S.me, p_allow_edit:$("f-allow").checked
      });
      if(row && row.id) S.events.set(row.id,toLocal(row));
      S.sel=date; const d=parse(date); S.view=new Date(d.getFullYear(),d.getMonth(),1);
      closeForm(); render();
    }catch(e){ $("formErr").textContent=saveErr(e); }
    finally{ $("saveBtn").disabled=false; }
  });
  $("delBtn").addEventListener("click", async ()=>{
    const b=$("delBtn");
    if(!b.dataset.confirm){ b.dataset.confirm="1"; b.textContent="Confirmar exclusão"; return; }
    const old=S.editing; if(!old) return;
    b.disabled=true;
    try{ await rpc("agenda_delete",{p_id:old.id,p_author:S.me}); S.events.delete(old.id); closeForm(); render(); }
    catch(e){ $("formErr").textContent=saveErr(e); }
    finally{ b.disabled=false; }
  });
  $("cancelBtn").addEventListener("click",closeForm);
  $("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeForm(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("overlay").classList.contains("hidden")) closeForm(); });
  $("f-allday").addEventListener("change",syncAllDay);
  $("f-start").addEventListener("change",()=>{ const s=$("f-start").value, en=$("f-end").value; if(s&&(!en||en<=s)){ const [h,m]=s.split(":").map(Number); $("f-end").value=pad(Math.min(23,h+1))+":"+pad(m); } });
  $("newBtn").addEventListener("click",()=>openForm(null,S.sel));
  $("fab").addEventListener("click",()=>openForm(null,S.sel));
  $("addDay").addEventListener("click",()=>openForm(null,S.sel));
  $("prev").addEventListener("click",()=>{ S.view=new Date(S.view.getFullYear(),S.view.getMonth()-1,1); renderMonth(); });
  $("next").addEventListener("click",()=>{ S.view=new Date(S.view.getFullYear(),S.view.getMonth()+1,1); renderMonth(); });
  $("todayBtn").addEventListener("click",()=>{ const t=new Date(); S.view=new Date(t.getFullYear(),t.getMonth(),1); S.sel=ymd(t); render(); });

  // ---------- notificações ----------
  const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone = !!navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  function b64ToBytes(b){ const p="=".repeat((4-b.length%4)%4), r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(r,c=>c.charCodeAt(0)); }
  function notifUI(text, showBtn){
    const box=$("notif");
    if(!text){ box.classList.add("hidden"); return; }
    $("notifText").textContent=text; $("notifBtn").classList.toggle("hidden",!showBtn); box.classList.remove("hidden");
  }
  function updateNotif(){
    if(!pushOK){
      notifUI(isIOS && !standalone ? "Para receber notificações no iPhone, adicione o app à Tela de Início (Compartilhar → Adicionar à Tela de Início) e abra por lá." : "Este navegador não permite notificações.", false);
      return;
    }
    if(Notification.permission==="granted"){ notifUI("",false); subscribePush().catch(()=>notifUI("Não deu para ativar as notificações agora.",true)); }
    else if(Notification.permission==="denied") notifUI("As notificações estão bloqueadas. Libere nos Ajustes do celular, em Notificações → Agenda.", false);
    else notifUI("Receba um aviso quando um compromisso for marcado e 1 hora antes de cada um.", true);
  }
  async function subscribePush(){
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(CFG.vapidPublicKey)});
    const j=sub.toJSON();
    await rpc("agenda_subscribe",{p_name:S.me, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth});
  }
  $("notifBtn").addEventListener("click", async ()=>{
    $("notifBtn").disabled=true;
    try{
      const perm=await Notification.requestPermission();
      if(perm==="granted"){ await subscribePush(); notifUI("Notificações ativadas neste celular.",false); setTimeout(()=>notifUI("",false),4000); }
      else updateNotif();
    }catch(e){ notifUI("Não deu para ativar as notificações. Tente de novo.",true); }
    finally{ $("notifBtn").disabled=false; }
  });

  // ---------- entrada ----------
  function showGate(msg){
    $("app").classList.add("hidden"); $("gate").classList.remove("hidden");
    $("g-name").value=S.me||""; $("gateErr").textContent=msg||"";
  }
  function logout(msg){
    store.del("agenda.code"); S.code=null; S.events=new Map(); S.loaded=false;
    if(S.timer){ clearInterval(S.timer); S.timer=null; }
    showGate(msg);
  }
  function start(){
    $("gate").classList.add("hidden"); $("app").classList.remove("hidden");
    render(); refresh(); updateNotif();
    if(!S.timer) S.timer=setInterval(()=>{ if(document.visibilityState==="visible") refresh(); },15000);
  }
  $("gateForm").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const code=$("g-code").value.trim().toLowerCase(), name=$("g-name").value.trim();
    if(!code){ $("gateErr").textContent="Digite o código da agenda."; return; }
    if(!name){ $("gateErr").textContent="Digite seu nome."; return; }
    $("gateBtn").disabled=true; $("gateErr").textContent="";
    S.code=code;
    try{ await rpc("agenda_check"); store.set("agenda.code",code); store.set("agenda.name",name); S.me=name; start(); }
    catch(e){ S.code=null; $("gateErr").textContent = e.badCode ? "Código incorreto. Confira com quem criou a agenda." : "Sem conexão com o servidor. Tente de novo."; }
    finally{ $("gateBtn").disabled=false; }
  });
  $("logout").addEventListener("click",()=>logout(""));
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.code) refresh(); });

  if(S.code && S.me) start(); else showGate("");

  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
